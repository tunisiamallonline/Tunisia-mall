<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة التحكم - Tunisia Mall</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#07111f;--card:#0d1b2a;--text:#f5f7fa;--muted:#aab7c4;--line:#24364a;--blue:#1683ff;--green:#20b15a;--red:#e5484d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
    header{background:#050b14;border-bottom:1px solid var(--line);padding:18px}
    .header{max-width:950px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
    .header a{color:white;text-decoration:none}.wrap{max-width:950px;margin:25px auto;padding:0 15px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
    .login{max-width:430px;margin:70px auto}.hidden{display:none!important}
    label{display:block;margin:12px 0 6px;font-weight:bold}input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:#081522;color:white}
    button{border:0;border-radius:8px;padding:11px 16px;color:white;font-weight:bold;cursor:pointer}
    .primary{background:var(--blue);width:100%;margin-top:15px}.green{background:var(--green)}.red{background:var(--red)}
    .msg{margin-top:12px;padding:10px;border-radius:8px;background:#172536}.muted{color:var(--muted);font-size:.9rem}
    .product{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
    .product:last-child{border-bottom:0}.product img{width:58px;height:58px;object-fit:cover;border-radius:8px;background:#111}
    .product-main{display:flex;align-items:center;gap:12px;min-width:0}.product-info{overflow:hidden}.product-info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @media(max-width:600px){.product{align-items:flex-start}.product button{flex-shrink:0}}
  </style>
</head>
<body>
<header><div class="header"><strong>🛒 Tunisia Mall — لوحة الأدمن</strong><a href="index.html">العودة للمتجر</a></div></header>

<div id="loginBox" class="wrap">
  <div class="card login">
    <h2>تسجيل دخول الأدمن</h2>
    <p class="muted">ادخل بحساب Supabase Auth المخصص للأدمن.</p>
    <label>البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="username">
    <label>كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password">
    <button class="primary" onclick="login()">دخول</button>
    <div id="loginMsg" class="msg hidden"></div>
  </div>
</div>

<div id="panel" class="wrap hidden">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <div><h2 style="margin:0">لوحة التحكم</h2><p id="userEmail" class="muted"></p></div>
      <button class="red" onclick="logout()">تسجيل الخروج</button>
    </div>
  </div>

  <div class="card">
    <h3>إضافة منتج جديد</h3>
    <label>اسم المنتج بالعربية</label><input id="nameAr" required>
    <label>اسم المنتج بالفرنسية</label><input id="nameFr" required>
    <label>السعر (TND)</label><input id="price" type="number" step="0.01" min="0" required>
    <label>رابط صورة المنتج</label><input id="imageUrl" type="url" placeholder="https://..." required>
    <button class="primary green" onclick="addProduct()">➕ إضافة المنتج</button>
    <div id="actionMsg" class="msg hidden"></div>
  </div>

  <div class="card">
    <h3>المنتجات الحالية</h3>
    <div id="products">جاري التحميل...</div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://sxajasczcwurclchyluf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "ضع_هنا_مفتاح_Supabase_Publishable_Key";

let supabaseClient = null;

function initSupabase(){
  if(!window.supabase) throw new Error("تعذر تحميل مكتبة Supabase.");
  if(!SUPABASE_PUBLISHABLE_KEY || SUPABASE_PUBLISHABLE_KEY.includes("ضع_هنا_")){
    throw new Error("لم يتم وضع Publishable Key الخاص بمشروع Supabase داخل الملف.");
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
}

function show(id,text){
  const el=document.getElementById(id); el.textContent=text; el.classList.remove("hidden");
}

async function login(){
  try{
    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value;
    if(!email || !password){show("loginMsg","أدخل البريد الإلكتروني وكلمة المرور.");return;}
    const {error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error){show("loginMsg","تعذر تسجيل الدخول: "+error.message);return;}
    await updateUI();
  }catch(e){show("loginMsg",e.message);}
}

async function logout(){
  await supabaseClient.auth.signOut();
  await updateUI();
}

async function updateUI(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  document.getElementById("loginBox").classList.toggle("hidden",!!session);
  document.getElementById("panel").classList.toggle("hidden",!session);
  if(session){
    document.getElementById("userEmail").textContent=session.user.email || "";
    loadProducts();
  }
}

async function addProduct(){
  const name_ar=document.getElementById("nameAr").value.trim();
  const name_fr=document.getElementById("nameFr").value.trim();
  const price=Number(document.getElementById("price").value);
  const image_url=document.getElementById("imageUrl").value.trim();

  if(!name_ar||!name_fr||!Number.isFinite(price)||!image_url){
    show("actionMsg","أكمل جميع البيانات بشكل صحيح.");return;
  }

  const {error}=await supabaseClient.from("products").insert([{name_ar,name_fr,price,image_url}]);
  if(error){show("actionMsg","خطأ أثناء الإضافة: "+error.message);return;}

  show("actionMsg","تمت إضافة المنتج بنجاح.");
  document.getElementById("nameAr").value="";
  document.getElementById("nameFr").value="";
  document.getElementById("price").value="";
  document.getElementById("imageUrl").value="";
  loadProducts();
}

async function loadProducts(){
  const box=document.getElementById("products");
  box.textContent="جاري التحميل...";
  const {data,error}=await supabaseClient.from("products").select("*").order("id",{ascending:false});
  if(error){box.textContent="خطأ في جلب المنتجات: "+error.message;return;}
  if(!data || !data.length){box.textContent="لا توجد منتجات حالياً.";return;}

  box.innerHTML=data.map(p=>`
    <div class="product">
      <div class="product-main">
        <img src="${escapeHtml(p.image_url||"")}" alt="">
        <div class="product-info">
          <strong>${escapeHtml(p.name_ar||"")} / ${escapeHtml(p.name_fr||"")}</strong>
          <span class="muted">${Number(p.price||0).toFixed(2)} TND</span>
        </div>
      </div>
      <button class="red" onclick="deleteProduct('${String(p.id).replace(/'/g,"\\'")}')">حذف</button>
    </div>`).join("");
}

async function deleteProduct(id){
  if(!confirm("هل أنت متأكد من حذف هذا المنتج؟")) return;
  const {error}=await supabaseClient.from("products").delete().eq("id",id);
  if(error){show("actionMsg","خطأ أثناء الحذف: "+error.message);return;}
  show("actionMsg","تم حذف المنتج.");
  loadProducts();
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

(async()=>{
  try{
    initSupabase();
    supabaseClient.auth.onAuthStateChange(()=>updateUI());
    await updateUI();
  }catch(e){
    show("loginMsg",e.message);
  }
})();
</script>
</body>
</html>
