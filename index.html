<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tunisia Mall</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="products.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#"><img src="logo.png" alt="Tunisia Mall"><span>Tunisia Mall</span></a>
  <a class="admin-link" href="admin.html">Admin</a>
</header>

<main>
  <section class="hero">
    <h1>مرحبا بكم في Tunisia Mall</h1>
    <p>تسوّق بسهولة والدفع عند الاستلام في كامل تونس.</p>
  </section>

  <section>
    <div class="section-head"><h2>المنتجات</h2><span id="cartCount">السلة: 0</span></div>
    <div id="products" class="grid"></div>
  </section>
</main>

<div id="cartPanel" class="cart-panel">
  <div class="cart-box">
    <button class="close" onclick="closeCart()">×</button>
    <h2>إتمام الطلب</h2>
    <div id="cartItems"></div>
    <div class="total">المجموع: <strong id="cartTotal">0.000 DT</strong></div>
    <form id="orderForm">
      <input id="customerName" required placeholder="الاسم واللقب">
      <input id="phone" required inputmode="tel" placeholder="رقم الهاتف">
      <input id="address" required placeholder="العنوان">
      <input id="city" placeholder="المدينة">
      <textarea id="notes" placeholder="ملاحظات (اختياري)"></textarea>
      <button class="primary" type="submit">تأكيد الطلب</button>
      <p id="orderMessage" class="message"></p>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
