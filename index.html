<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunisia Mall - Boutique en ligne</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-area">
                <img src="Logo.png" alt="Tunisia Mall Logo" class="logo" id="site-logo">
                <h1 id="site-title">Tunisia Mall</h1>
            </div>
            <div class="header-controls">
                <button id="lang-btn" onclick="toggleLanguage()">العربية</button>
                <button id="theme-btn" onclick="toggleTheme()">🌙</button>
                <div class="cart-icon-container" onclick="toggleCart()">
                    🛒 <span id="cart-count">0</span>
                </div>
            </div>
        </div>
        <div class="search-bar-container">
            <input type="text" id="search-input" placeholder="Rechercher des produits..." oninput="filterProducts()">
        </div>
    </header>

    <main>
        <section class="banner">
            <h2 id="welcome-msg">Bienvenue chez Tunisia Mall</h2>
            <p id="sub-msg">Boutique en ligne tunisienne moderne</p>
        </section>

        <section class="products-section">
            <h2 id="products-title">Nos Produits</h2>
            <div id="loading" class="loading-spinner">Chargement des produits...</div>
            <div id="products-grid" class="products-grid"></div>
        </section>
    </main>

    <!-- Slide-in Cart -->
    <div id="cart-modal" class="cart-modal">
        <div class="cart-content">
            <div class="cart-header">
                <h3 id="cart-title">Mon Panier</h3>
                <span class="close-btn" onclick="toggleCart()">&times;</span>
            </div>
            <div id="cart-items" class="cart-items"></div>
            <div class="cart-footer">
                <div class="total-price">
                    <span id="total-label">Total:</span> <span id="cart-total">0.00</span> TND
                </div>
                <button class="whatsapp-btn" onclick="checkoutWhatsApp()" id="checkout-btn">Commander via WhatsApp 📱</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Tunisia Mall. Tous droits réservés.</p>
        <p><a href="admin.html" class="admin-link">Espace Admin / لوحة التحكم</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
