<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tunisia Mall - Admin</title><link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head>
<body><main class="wrap"><div class="head"><h1>لوحة تحكم الطلبات</h1><button id="logout" class="secondary" hidden>تسجيل الخروج</button></div>
<section id="loginBox" class="panel"><h2>دخول Admin</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="login" class="primary">دخول</button><p id="loginMsg"></p></section>
<section id="ordersBox" hidden><div class="stats"><div>كل الطلبات <b id="allCount">0</b></div><div>الجديدة <b id="newCount">0</b></div></div><div id="orders"></div></section></main>
<script src="admin.js"></script></body></html>
