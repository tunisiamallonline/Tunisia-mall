<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tunisia Mall — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#eef5ff}
.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#0d1b2d;border:1px solid #1e3652;border-radius:16px;padding:18px;margin:14px 0}
h1,h2{margin-top:0}.muted{color:#9db0c5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,select,textarea,button{width:100%;padding:12px;border-radius:10px;border:1px solid #29435f;background:#091522;color:#fff}
textarea{min-height:90px}button{cursor:pointer;background:#155da8;border:0;font-weight:bold}button.danger{background:#a92d38}button.gray{background:#34485d}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.order,.product{border-top:1px solid #28405a;padding:14px 0}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#163d62;margin:3px}
#app{display:none}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.logo{font-size:24px;font-weight:bold}.small{font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card">
    <h1>🔐 Tunisia Mall Admin</h1>
    <p class="muted">تسجيل الدخول إلى لوحة التحكم</p>
    <input id="email" type="email" value="tunisiamallenligne@gmail.com" placeholder="البريد الإلكتروني">
    <br><br><input id="password" type="password" placeholder="كلمة السر">
    <br><br><button onclick="login()">دخول</button>
    <p id="loginMsg" class="muted"></p>
  </div>

  <div id="app">
    <div class="top">
      <div class="logo">🛒 Tunisia Mall — Admin</div>
      <button class="gray" style="width:auto;padding:10px 18px" onclick="logout()">تسجيل الخروج</button>
    </div>

    <div class="grid">
      <div class="card"><div class="muted">الطلبات</div><h2 id="ordersCount">0</h2></div>
      <div class="card"><div class="muted">المنتجات</div><h2 id="productsCount">0</h2></div>
    </div>

    <div class="card">
      <h2>📦 الطلبات</h2>
      <button onclick="loadOrders()">🔄 تحديث الطلبات</button>
      <div id="orders"></div>
    </div>

    <div class="card">
      <h2>➕ إضافة منتج</h2>
      <div class="grid">
        <input id="pname" placeholder="اسم المنتج">
        <input id="pprice" type="number" step="0.001" placeholder="السعر بالدينار">
        <input id="pcat" placeholder="القسم (إلكترونيات، ألعاب...)">
        <input id="pimage" placeholder="رابط صورة المنتج">
      </div>
      <br><textarea id="pdesc" placeholder="وصف المنتج"></textarea><br>
      <button onclick="addProduct()">إضافة المنتج</button>
      <p id="productMsg" class="muted"></p>
    </div>

    <div class="card">
      <h2>🛍️ المنتجات</h2>
      <button onclick="loadProducts()">🔄 تحديث المنتجات</button>
      <div id="products"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL="https://sxajasczcwurclchyluf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="ضع_مفتاح_Supabase_Publishable_Key_هنا";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const $=id=>document.getElementById(id);
let editingId=null;

async function login(){
  const email=$("email").value.trim(), password=$("password").value;
  $("loginMsg").textContent="جار تسجيل الدخول...";
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){$("loginMsg").textContent="خطأ: "+error.message;return}
  showApp();
}

async function showApp(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$("login").style.display="block";$("app").style.display="none";return}
  $("login").style.display="none";$("app").style.display="block";
  loadOrders(); loadProducts();
}

async function logout(){await sb.auth.signOut();location.reload()}

async function loadOrders(){
  const box=$("orders"); box.innerHTML="<p class='muted'>جار التحميل...</p>";
  const {data,error}=await sb.from("orders").select("*").order("created_at",{ascending:false});
  if(error){box.innerHTML="<p>تعذر تحميل الطلبات: "+error.message+"</p>";return}
  $("ordersCount").textContent=data?.length||0;
  if(!data?.length){box.innerHTML="<p class='muted'>لا توجد طلبات حاليا.</p>";return}
  box.innerHTML=data.map(o=>{
    const id=o.id??"";
    const customer=o.customer_name??o.name??"";
    const phone=o.phone??o.customer_phone??"";
    const total=o.total??o.total_price??"";
    const status=o.status??"new";
    return `<div class="order">
      <b>طلب #${id}</b> <span class="badge">${status}</span>
      <div>👤 ${esc(customer)}</div><div>📞 ${esc(phone)}</div>
      <div>💰 ${esc(total)} د.ت</div>
      <div class="small muted">${esc(JSON.stringify(o.items??o.products??""))}</div>
      <div class="actions">
        <button onclick="setOrderStatus('${safe(id)}','confirmed')">تأكيد</button>
        <button onclick="setOrderStatus('${safe(id)}','shipped')">شحن</button>
        <button onclick="setOrderStatus('${safe(id)}','completed')">مكتمل</button>
        <button class="danger" onclick="deleteOrder('${safe(id)}')">حذف</button>
      </div>
    </div>`;
  }).join("");
}

async function setOrderStatus(id,status){
  const {error}=await sb.from("orders").update({status}).eq("id",id);
  if(error) alert(error.message); else loadOrders();
}
async function deleteOrder(id){
  if(!confirm("حذف هذا الطلب؟")) return;
  const {error}=await sb.from("orders").delete().eq("id",id);
  if(error) alert(error.message); else loadOrders();
}

async function addProduct(){
  const row={
    name:$("pname").value.trim(),
    price:Number($("pprice").value),
    category:$("pcat").value.trim(),
    image:$("pimage").value.trim(),
    description:$("pdesc").value.trim()
  };
  if(!row.name||!row.price){$("productMsg").textContent="أدخل اسم المنتج والسعر.";return}
  const {error}=await sb.from("products").insert(row);
  if(error){$("productMsg").textContent="خطأ: "+error.message;return}
  $("productMsg").textContent="تمت إضافة المنتج.";
  ["pname","pprice","pcat","pimage","pdesc"].forEach(x=>$(x).value="");
  loadProducts();
}

async function loadProducts(){
  const box=$("products"); box.innerHTML="<p class='muted'>جار التحميل...</p>";
  const {data,error}=await sb.from("products").select("*").order("created_at",{ascending:false});
  if(error){box.innerHTML="<p>تعذر تحميل المنتجات: "+error.message+"</p>";return}
  $("productsCount").textContent=data?.length||0;
  if(!data?.length){box.innerHTML="<p class='muted'>لا توجد منتجات.</p>";return}
  box.innerHTML=data.map(p=>`
    <div class="product">
      <b>${esc(p.name??"بدون اسم")}</b>
      <span class="badge">${esc(p.category??"")}</span>
      <div>💰 ${esc(p.price??"")} د.ت</div>
      ${p.image?`<div class="small">🖼️ ${esc(p.image)}</div>`:""}
      <div class="actions"><button class="danger" onclick="deleteProduct('${safe(p.id)}')">حذف</button></div>
    </div>`).join("");
}

async function deleteProduct(id){
  if(!confirm("حذف هذا المنتج؟")) return;
  const {error}=await sb.from("products").delete().eq("id",id);
  if(error) alert(error.message); else loadProducts();
}
function safe(v){return String(v).replace(/'/g,"\\'")}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

sb.auth.onAuthStateChange(()=>showApp());
showApp();
</script>
</body>
</html>
