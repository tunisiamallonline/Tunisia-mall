<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tunisia Mall - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#fff}
.wrap{max-width:1050px;margin:auto;padding:20px}.card{background:#0d1b2a;border:1px solid #21344a;border-radius:16px;padding:20px;margin:15px 0}
h1,h2{margin-top:0}.muted{color:#aebdca}input,textarea,select{width:100%;padding:12px;margin:7px 0 12px;border-radius:10px;border:1px solid #33485e;background:#081522;color:#fff;font-size:15px}
button{border:0;border-radius:10px;padding:12px 18px;background:#1677ff;color:#fff;font-weight:bold;cursor:pointer;margin:4px}
button.danger{background:#d9363e}button.secondary{background:#33485e}
.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.product{background:#081522;border:1px solid #263b50;border-radius:12px;padding:12px}.product img{width:100%;height:170px;object-fit:contain;background:#fff;border-radius:8px}
.msg{padding:10px;border-radius:9px;background:#142b42;margin:10px 0}.ok{background:#123b2a}.err{background:#4a1820}
label{font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card">
    <h1>🔐 Tunisia Mall — Admin</h1>
    <p class="muted">سجّل الدخول بحساب الأدمن في Supabase.</p>
    <label>البريد الإلكتروني</label>
    <input id="email" type="email" value="tunisiamallenligne@gmail.com" autocomplete="username">
    <label>كلمة السر</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة السر الجديدة">
    <button onclick="login()">دخول</button>
    <div id="loginMsg"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <h1>🛍️ لوحة تحكم Tunisia Mall</h1>
      <p id="userInfo" class="muted"></p>
      <button class="secondary" onclick="logout()">تسجيل الخروج</button>
    </div>

    <div class="card">
      <h2>➕ إضافة منتوج</h2>
      <label>اسم المنتوج</label><input id="name" placeholder="مثال: سماعات Bluetooth">
      <label>السعر (د.ت)</label><input id="price" type="number" step="0.001" placeholder="49.900">
      <label>القسم</label>
      <select id="category">
        <option value="electronics">الإلكترونيات</option>
        <option value="toys">الألعاب</option>
        <option value="other">أخرى</option>
      </select>
      <label>الوصف</label><textarea id="description" rows="4" placeholder="وصف المنتوج"></textarea>
      <label>صورة المنتوج</label><input id="image" type="file" accept="image/*">
      <button onclick="addProduct()">حفظ المنتوج</button>
      <div id="addMsg"></div>
    </div>

    <div class="card">
      <h2>📦 المنتوجات</h2>
      <button onclick="loadProducts()">تحديث</button>
      <div id="products" class="grid"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://wpsbxhbjetxskcuktcng.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_FbKKHDuGIz_21743WXFYbg_BVhd6jvk";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const $ = id => document.getElementById(id);
function msg(id,text,ok=false){$(id).innerHTML='<div class="msg '+(ok?'ok':'err')+'">'+text+'</div>'}

async function login(){
  const email=$("email").value.trim(), password=$("password").value;
  if(!email || !password) return msg("loginMsg","أدخل البريد الإلكتروني وكلمة السر.");
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error) return msg("loginMsg","تعذر تسجيل الدخول: "+error.message);
  showPanel();
}

async function logout(){await sb.auth.signOut(); location.reload()}

async function showPanel(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){$("login").classList.remove("hidden");$("panel").classList.add("hidden");return}
  $("login").classList.add("hidden");$("panel").classList.remove("hidden");
  $("userInfo").textContent="تم تسجيل الدخول: "+user.email;
  loadProducts();
}

async function addProduct(){
  const name=$("name").value.trim(), price=parseFloat($("price").value);
  const category=$("category").value, description=$("description").value.trim();
  const file=$("image").files[0];
  if(!name || !Number.isFinite(price)) return msg("addMsg","أدخل اسم المنتوج والسعر.");
  let image_url=null;

  if(file){
    const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
    const path=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
    const {error:upErr}=await sb.storage.from("product-images").upload(path,file,{upsert:false});
    if(upErr) return msg("addMsg","خطأ في رفع الصورة: "+upErr.message);
    const {data}=sb.storage.from("product-images").getPublicUrl(path);
    image_url=data.publicUrl;
  }

  const {error}=await sb.from("products").insert({
    name, price, category, description, image_url
  });
  if(error) return msg("addMsg","خطأ في حفظ المنتوج: "+error.message);

  $("name").value="";$("price").value="";$("description").value="";$("image").value="";
  msg("addMsg","تمت إضافة المنتوج بنجاح ✅",true);
  loadProducts();
}

async function loadProducts(){
  const box=$("products"); box.innerHTML="<p class='muted'>جاري التحميل...</p>";
  const {data,error}=await sb.from("products").select("*").order("id",{ascending:false});
  if(error){box.innerHTML=""; return msg("addMsg","تعذر جلب المنتوجات: "+error.message)}
  if(!data?.length){box.innerHTML="<p class='muted'>لا توجد منتوجات بعد.</p>";return}
  box.innerHTML=data.map(p=>`
    <div class="product">
      ${p.image_url?`<img src="${escapeHtml(p.image_url)}" alt="">`:"<div style='height:170px;display:grid;place-items:center;background:#fff;color:#777;border-radius:8px'>بدون صورة</div>"}
      <h3>${escapeHtml(p.name||"")}</h3>
      <b>${Number(p.price||0).toFixed(3)} د.ت</b>
      <p class="muted">${escapeHtml(p.description||"")}</p>
      <button class="danger" onclick="deleteProduct('${String(p.id).replace(/'/g,"\\'")}')">حذف</button>
    </div>`).join("");
}

async function deleteProduct(id){
  if(!confirm("هل تريد حذف هذا المنتوج؟")) return;
  const {error}=await sb.from("products").delete().eq("id",id);
  if(error) return msg("addMsg","تعذر الحذف: "+error.message);
  loadProducts();
}

function escapeHtml(v){
  return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

sb.auth.getSession().then(({data})=>{if(data.session) showPanel()});
sb.auth.onAuthStateChange((event,session)=>{if(session) showPanel()});
</script>
</body>
</html>
